<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Import HR Data - ERP</title>
    <link rel="icon" href="[[${#request.contextPath}]]/erpnext-logo.svg" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body onload="lucide.createIcons()">
    <div th:replace="~{inc/header :: header}"></div>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4 page-header pb-2">
            <h2 class="mb-0 d-flex align-items-center gap-2">
                <i data-lucide="upload"></i> Import HR Data
            </h2>
        </div>

        <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${success != null}" class="alert alert-success" th:text="${success}"></div>

        <form th:action="@{/hr/import}" method="post" enctype="multipart/form-data" class="card">
            <div class="card-body">
                <div class="row mb-4">
                    <div class="col-md-12">
                        <div class="mb-3">
                            <label for="employeeCsv" class="form-label">
                                <i data-lucide="users" class="me-1"></i> Employee CSV File
                            </label>
                            <input type="file" class="form-control" id="employeeCsv" name="employeeCsv" accept=".csv" required>
                        </div>

                        <div class="mb-3">
                            <label for="salaryStructureCsv" class="form-label">
                                <i data-lucide="landmark" class="me-1"></i> Salary Structure CSV File
                            </label>
                            <input type="file" class="form-control" id="salaryStructureCsv" name="salaryStructureCsv" accept=".csv" required>
                        </div>

                        <div class="mb-3">
                            <label for="assignmentCsv" class="form-label">
                                <i data-lucide="link" class="me-1"></i> Salary Structure Assignment CSV File
                            </label>
                            <input type="file" class="form-control" id="assignmentCsv" name="assignmentCsv" accept=".csv" required>
                        </div>
                    </div>
                </div>

                <div class="alert alert-info" role="alert">
                    <h5 class="alert-heading"><i data-lucide="info" class="me-1"></i> CSV File Format Requirements:</h5>
                    <p class="mb-0">
                        <strong>Employee CSV:</strong> ref, nom, prenom, genre, date embauche, date naissance, company<br>
                        <strong>Salary Structure CSV:</strong> salary structure, name, abbr, type, valeur, company<br>
                        <strong>Assignment CSV:</strong> mois, ref employe, salaire base, salaire
                    </p>
                </div>
            </div>

            <div class="card-footer text-end">
                <button type="submit" class="btn btn-primary">
                    <i data-lucide="upload-cloud" class="me-1"></i> Import Data
                </button>
            </div>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
