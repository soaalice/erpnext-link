<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Employee Details - ERP</title>
    <link rel="icon" href="@{/erpnext-logo.svg}" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .table th,
        .table td {
            vertical-align: middle;
        }

        .page-header {
            border-bottom: 1px solid #dee2e6;
        }
    </style>
</head>

<body onload="lucide.createIcons()">
    <div th:replace="~{inc/header :: header}"></div>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4 page-header pb-2">
            <h2 class="mb-0 d-flex align-items-center gap-2">
                <i data-lucide="user"></i> Employee Details
            </h2>
        </div>

        <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${success != null}" class="alert alert-success" th:text="${success}"></div>

        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Employee Information</h5>
                <div class="row">
                    <div class="col-md-12">
                        <p><strong>Full name:</strong> <span th:text="${employee.employeeName}">N/A</span></p>
                        <p><strong>Gender:</strong> <span th:text="${employee.gender}">N/A</span></p>
                        <p><strong>Company:</strong> <span th:text="${employee.company}">N/A</span></p>
                        <p><strong>Date of Birth:</strong> <span th:text="${employee.dateOfBirth}">N/A</span></p>
                        <p><strong>Date of Joining:</strong> <span th:text="${employee.dateOfJoining}">N/A</span></p>
                    </div>
                </div>
            </div>
        </div>

        <h4 class="mb-3">Salary Slips</h4>
        <div class="table-responsive mb-5">
            <table class="table table-hover table-sm align-middle table-bordered">
                <thead class="table-light">
                    <tr>
                        <th style="width: 60px;">#</th>
                        <th>Name</th>
                        <th>Gross Pay</th>
                        <th>Net Pay</th>
                        <th>Status</th>
                        <th style="width: 100px;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="salarySlip, stat : ${salarySlips}">
                        <td th:text="${stat.index + 1}">1</td>
                        <td th:text="${salarySlip.name}">SLIP-001</td>
                        <td th:text="${salarySlip.grossPay}">0.00</td>
                        <td th:text="${salarySlip.netPay}">0.00</td>
                        <td th:text="${salarySlip.status}">Draft</td>
                        <td>
                            <form th:action="@{/hr/salary-slip/export}" method="post" style="display: inline;">
                                <input type="hidden" name="name" th:value="${salarySlip.name}">
                                <button type="submit" class="btn btn-sm btn-primary">
                                    <i data-lucide="file-output"></i> Export to PDF
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- <h4 class="mb-3">Purchase Invoices</h4>
        <div class="table-responsive">
            <table class="table table-hover table-sm align-middle table-bordered">
                <thead class="table-light">
                    <tr>
                        <th style="width: 60px;">#</th>
                        <th>Invoice Number</th>
                        <th>Status</th>
                        <th>Due Date</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="invoice, stat : ${invoices}">

                        <td th:text="${invoice.total}">0.00</td>
                    </tr>
                </tbody>
            </table>
        </div> -->
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
